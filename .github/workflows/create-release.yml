---
name: Create Release

on:
  workflow_call:
    inputs:
      tag-name:
        required: true
        type: string
        description: 'Tag name for the release'
      release-name:
        required: true
        type: string
        description: 'Display name for the release'
      is-prerelease:
        required: false
        type: boolean
        default: false
        description: 'Whether this is a prerelease'
      release-body:
        required: false
        type: string
        description: 'Release body text'

permissions:
  contents: write
  packages: write
  actions: read

jobs:
  create-release:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    concurrency:
      group: release-${{ inputs.tag-name }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # we need full history for tags

      - name: Configure git for release steps
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

      - name: Download all artifacts
        uses: actions/download-artifact@v8

      - name: Compute artifact list
        id: files
        shell: bash
        run: |
          {
            echo "list<<EOF"
            echo "macos-builds/build/*.dmg"
            echo "macos-builds/ECUxPlot.dmg"
            echo "macos-builds/build/*.zip"
            echo "linux-windows-builds/build/ECUxPlot-*.jar"
            echo "linux-windows-builds/build/*.tar.gz"
            echo "linux-windows-builds/build/*.exe"
            echo "linux-windows-builds/ECUxPlot-setup.exe"
            echo "linux-windows-builds/ECUxPlot.jar"
            echo "linux-windows-builds/mapdump.jar"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Prepare git-cliff args
        id: prepare_cliff
        run: ./scripts/release-notes.sh "${{ inputs.tag-name }}" --print-args >> "$GITHUB_OUTPUT"

      - name: Generate release notes with git-cliff
        id: git_cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: ${{ steps.prepare_cliff.outputs.args }}
        env:
          OUTPUT: /tmp/release-notes.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Create release
        id: create_release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag-name }}
          name: ${{ inputs.release-name }}
          draft: false
          prerelease: ${{ inputs.is-prerelease }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: false
          body: |
            ${{ inputs.release-body }}

            ## Changelog

            ${{ steps.git_cliff.outputs.content }}
          files: ${{ steps.files.outputs.list }}
          fail_on_unmatched_files: false

      - name: Purge stale prereleases and orphan releases
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.create_release.outcome }}" == "success" ]]; then
            CURR_TAG="${{ inputs.tag-name }}"
            gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            | jq -r --arg CURR_TAG "$CURR_TAG" '
                .[]
                | select((.prerelease == true or .draft == true) and (.tag_name // "") != $CURR_TAG)
                | [.id, (.tag_name // ""), (.draft // false), (.prerelease // false)]
                | @tsv
              ' \
            | while IFS=$'\t' read -r rel_id tag_name is_draft is_pre; do
                if [[ -n "$tag_name" ]]; then
                  echo "Removing $( [[ "$is_draft" == "true" ]] && echo draft || echo pre-release ) release: $tag_name (git tag ref kept)"
                  gh release delete "$tag_name" -R "$GITHUB_REPOSITORY" -y || true
                else
                  echo "Deleting draft with no tag by id: $rel_id"
                  gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/$rel_id" || true
                fi
              done
          fi

          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
          | jq -r '
              .[]
              | [.id, (.tag_name // ""), (.draft // false)]
              | @tsv
            ' \
          | while IFS=$'\t' read -r rel_id tag_name is_draft; do
              if [[ -z "$tag_name" ]]; then
                echo "Deleting release id=$rel_id with empty tag_name"
                gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/$rel_id" || true
                continue
              fi
              if ! gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/$tag_name" >/dev/null 2>&1; then
                echo "Deleting release with missing tag ref: $tag_name (draft=$is_draft)"
                gh release delete "$tag_name" -R "$GITHUB_REPOSITORY" -y || true
              fi
            done
